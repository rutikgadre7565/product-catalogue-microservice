
name: Product Catalogue CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: product-catalogue-microservice/package-lock.json

      - name: Install dependencies
        working-directory: product-catalogue-microservice
        run: npm ci

      - name: Lint with ESLint
        working-directory: product-catalogue-microservice
        run: npm run lint

      - name: Run unit tests with Jest
        working-directory: product-catalogue-microservice
        run: npm test -- --runInBand
